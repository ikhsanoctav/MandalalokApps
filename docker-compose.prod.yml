services:
    # Nginx Web Server (Menangani Request dari Luar)
    web:
        image: nginx:alpine
        restart: unless-stopped
        ports:
            - "80:80"
            # Jika nanti di VPS Anda memakai SSL mandiri tanpa load balancer:
            # - "443:443"
        volumes:
            - prod-public:/var/www/html/public:ro
            - prod-storage:/var/www/html/storage:ro
            - ./nginx.prod.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - app
        networks:
            - production_net

    # PHP-FPM Application (Menjalankan Script Laravel)
    app:
        build:
            context: .
            dockerfile: Dockerfile.prod
        restart: unless-stopped
        volumes:
            - prod-public:/var/www/html/public
            - prod-storage:/var/www/html/storage
        environment:
            - APP_ENV=production
            - APP_DEBUG=false
            - DB_HOST=mysql
        networks:
            - production_net
        depends_on:
            - mysql

    # Database MySQL Terisolasi (Port ditutup dari luar)
    mysql:
        image: 'mysql:8.4'
        restart: unless-stopped
        # PERHATIKAN: Tidak ada setting 'ports', sehingga MySQL 100% aman dari public internet
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
        volumes:
            - 'prod-mysql:/var/lib/mysql'
        networks:
            - production_net
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-p${DB_PASSWORD}"]
            retries: 3
            timeout: 5s

    # n8n AI Workflow (Tertutup, hanya bisa diakses via Reverse Proxy jika mau)
    n8n:
        image: docker.n8n.io/n8nio/n8n:latest
        restart: unless-stopped
        environment:
            - N8N_HOST=localhost
            - N8N_PORT=5678
            - N8N_PROTOCOL=http
            - GENERIC_TIMEZONE=Asia/Jakarta
            # Jangan lupa setup N8N_BASIC_AUTH_ACTIVE=true di VPS agar n8n aman
        volumes:
            - prod-n8n_data:/home/node/.n8n
        networks:
            - production_net
        depends_on:
            - mysql

networks:
    production_net:
        driver: bridge

volumes:
    prod-mysql:
        driver: local
    prod-n8n_data:
        driver: local
    prod-storage:
        driver: local
    prod-public:
        driver: local
